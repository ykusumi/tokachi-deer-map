<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十勝エゾシカ遭遇注意マップ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            flex: 1;
        }
        .deer-marker-icon {
            background: transparent;
            border: none;
            text-align: center;
            font-size: 24px;
            line-height: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row bg-gray-50 relative m-0">

    <!-- スマホ用：メニューを開くボタン -->
    <button id="open-menu-btn" class="absolute top-3 left-3 z-[1000] md:hidden bg-emerald-800 text-white px-3.5 py-2 rounded-lg shadow-lg flex items-center gap-1.5 text-xs font-bold hover:bg-emerald-900 transition">
        <span>☰ メニュー</span>
    </button>

    <!-- サイドバー / メインパネル -->
    <div id="sidebar" class="fixed md:static inset-y-0 left-0 z-[1100] w-80 md:w-96 bg-white shadow-2xl md:shadow-xl flex flex-col h-full transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="p-4 border-b border-gray-100 bg-emerald-800 text-white flex justify-between items-center">
            <h1 class="font-bold text-base flex items-center gap-2">
                🦌 十勝エゾシカ遭遇注意マップ
            </h1>
            <button id="close-menu-btn" class="md:hidden text-white text-xs px-2.5 py-1.5 bg-emerald-700 hover:bg-emerald-600 rounded">
                ✕ 閉じる
            </button>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto space-y-4">
            <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-900 leading-relaxed">
                十勝エリアでのエゾシカ目撃情報を共有し、安全なドライブを守るためのマップです。
            </div>
            
            <!-- 投稿フォームエリア -->
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-3">
                <h2 class="text-xs font-bold text-gray-700">目撃情報を投稿する</h2>
                
                <div>
                    <label class="block text-[11px] text-gray-600 mb-1">場所・道路名</label>
                    <input type="text" id="input-road" placeholder="例: 国道38号線 幕別豊頃間" class="w-full px-3 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] text-gray-600 mb-1">危険度を選択</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="risk-btn py-1.5 px-2 bg-yellow-500 text-white text-xs font-medium rounded shadow-sm hover:opacity-95" data-level="middle">注意 (middle)</button>
                        <button type="button" class="risk-btn py-1.5 px-2 bg-orange-500 text-white text-xs font-medium rounded shadow-sm hover:opacity-95" data-level="high">警戒 (high)</button>
                        <button type="button" class="risk-btn py-1.5 px-2 bg-red-600 text-white text-xs font-medium rounded shadow-sm hover:opacity-95" data-level="danger">危険 (danger)</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] text-gray-600 mb-1">時間帯</label>
                    <input type="text" id="input-time" placeholder="例: 夜 17時半ぐらい" class="w-full px-3 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] text-gray-600 mb-1">コメント・状況</label>
                    <input type="text" id="input-comment" placeholder="例: 西側から急に飛び出してきた" class="w-full px-3 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-emerald-600">
                </div>

                <div class="space-y-2 pt-1">
                    <button id="add-current-loc-btn" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded shadow transition text-xs flex items-center justify-center gap-1.5">
                        📍 現在地（GPS）で投稿する
                    </button>
                    <p class="text-[10px] text-gray-500 text-center">※または地図上の場所をクリック</p>
                </div>
            </div>

            <!-- 目撃情報一覧（閲覧用） -->
            <div id="marker-list" class="space-y-2 mt-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">最近の目撃情報</h2>
                    <button id="open-admin-modal" class="text-[11px] text-emerald-700 hover:underline font-medium">🔑 管理画面を開く</button>
                </div>
                <div id="list-items" class="space-y-2">
                    <!-- 動的にリストが追加されます -->
                </div>
            </div>
        </div>

        <div class="p-3 border-t border-gray-100 bg-gray-50 text-center">
            <p class="text-[10px] md:text-xs text-gray-400">
                サーバー維持・開発は 
                <a href="https://ofuse.me/sky_horizon_self" target="_blank" rel="noopener noreferrer" class="text-emerald-600 hover:underline font-medium">
                    OFUSE
                </a> 
                にて受付中☕
            </p>
        </div>
    </div>

    <!-- メインマップエリア -->
    <div id="map"></div>

    <!-- 管理画面用モーダル -->
    <div id="admin-modal" class="fixed inset-0 z-[2000] bg-black bg-opacity-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-gray-800 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2">🔑 管理者ログイン・データ管理画面</h3>
                <button id="close-admin-modal" class="text-gray-300 hover:text-white text-sm font-bold">✕ 閉じる</button>
            </div>

            <div id="auth-section" class="p-6 space-y-3">
                <p class="text-xs text-gray-600">登録された情報の削除や管理を行うには、管理者パスワードを入力してください。</p>
                <div class="flex gap-2">
                    <input type="password" id="admin-pass-input" placeholder="パスワードを入力" class="flex-1 px-3 py-2 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-gray-800">
                    <button id="auth-submit-btn" class="bg-gray-800 hover:bg-gray-900 text-white text-xs px-4 py-2 rounded font-medium">認証</button>
                </div>
            </div>

            <div id="admin-panel-section" class="p-4 flex-1 overflow-y-auto space-y-3 hidden">
                <div class="flex justify-between items-center bg-gray-100 p-2 rounded text-xs font-bold text-gray-700">
                    <span>登録データ一覧（削除可能）</span>
                    <button id="logout-admin-btn" class="text-red-600 hover:underline text-[11px]">ログアウト</button>
                </div>
                <div id="admin-list-items" class="space-y-2">
                    <!-- 管理用リストがここに展開されます -->
                </div>
            </div>
        </div>
    </div>

    <script>
        try {
            // Supabase設定
            const SUPABASE_URL = 'https://qzjcfwvddpstqcqrpguz.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_d86l8Fqu8Ml1lX_lU11zLw_3e7LGf91';
            const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // 地図の初期化（十勝エリア）
            const map = L.map('map', { zoomControl: false }).setView([42.93, 143.65], 10);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 300);

            // スマホ用メニュー開閉の制御
            const sidebar = document.getElementById('sidebar');
            document.getElementById('open-menu-btn').addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                setTimeout(() => { map.invalidateSize(); }, 200);
            });

            document.getElementById('close-menu-btn').addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                setTimeout(() => { map.invalidateSize(); }, 200);
            });

            // 管理画面モーダルの開閉
            const adminModal = document.getElementById('admin-modal');
            document.getElementById('open-admin-modal').addEventListener('click', () => {
                adminModal.classList.remove('hidden');
                document.getElementById('admin-pass-input').value = '';
            });
            document.getElementById('close-admin-modal').addEventListener('click', () => {
                adminModal.classList.add('hidden');
            });

            // Supabase関数（verify_admin）によるパスワード認証
            document.getElementById('auth-submit-btn').addEventListener('click', async () => {
                const inputVal = document.getElementById('admin-pass-input').value;
                if (!inputVal) return;

                const { data, error } = await db.rpc('verify_admin', { input_pass: inputVal });

                if (error) {
                    alert('認証エラー: ' + error.message);
                    return;
                }

                if (data === true) {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('admin-panel-section').classList.remove('hidden');
                    loadAdminMarkers();
                } else {
                    alert('パスワードが間違っています。');
                    document.getElementById('admin-pass-input').value = '';
                }
            });

            document.getElementById('logout-admin-btn').addEventListener('click', () => {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('admin-panel-section').classList.add('hidden');
                document.getElementById('admin-pass-input').value = '';
            });

            // 選択されている危険度の管理
            let selectedDanger = 'middle';
            document.querySelectorAll('.risk-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('ring-2', 'ring-offset-1', 'ring-black'));
                    e.target.classList.add('ring-2', 'ring-offset-1', 'ring-black');
                    selectedDanger = e.target.getAttribute('data-level');
                });
            });
            document.querySelector('.risk-btn[data-level="middle"]').classList.add('ring-2', 'ring-offset-1', 'ring-black');

            let markersLayer = L.layerGroup().addTo(map);

            // 鹿のアイコン（絵文字）
            const deerIcon = L.divIcon({
                className: 'deer-marker-icon',
                html: '🦌',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -10]
            });

            // 目撃情報一覧をロード
            async function loadMarkers() {
                markersLayer.clearLayers();
                const listItems = document.getElementById('list-items');
                listItems.innerHTML = '<p class="text-xs text-gray-400">読み込み中...</p>';

                const { data, error } = await db
                    .from('deer_spots')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('データ取得エラー:', error);
                    listItems.innerHTML = '<p class="text-xs text-red-500">情報を取得できませんでした</p>';
                    return;
                }

                listItems.innerHTML = '';

                if (!data || data.length === 0) {
                    listItems.innerHTML = '<p class="text-xs text-gray-400">まだ登録されたデータはありません</p>';
                    return;
                }

                data.forEach(sighting => {
                    const danger = sighting.danger_level || 'middle';
                    let badgeColor = 'bg-yellow-100 text-yellow-800';
                    if (danger === 'high') badgeColor = 'bg-orange-100 text-orange-800';
                    if (danger === 'danger') badgeColor = 'bg-red-100 text-red-800';

                    const marker = L.marker([sighting.latitude, sighting.longitude], { icon: deerIcon }).addTo(markersLayer);
                    marker.bindPopup(`
                        <div class="p-1 space-y-1">
                            <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">【${danger}】</span>
                            <div class="font-bold text-xs text-gray-800">${sighting.road_name || '場所未登録'}</div>
                            <p class="text-xs text-gray-600">${sighting.comment || '詳細なし'}</p>
                            <p class="text-[10px] text-gray-400">時間帯: ${sighting.time_slot || '不明'}</p>
                        </div>
                    `);

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'p-2.5 bg-white border border-gray-100 rounded-lg shadow-sm text-xs space-y-1 hover:bg-emerald-50 transition cursor-pointer';
                    itemDiv.innerHTML = `
                        <div class="flex items-center justify-between mb-1">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">【${danger}】</span>
                            <span class="text-[10px] text-gray-400">${sighting.time_slot || ''}</span>
                        </div>
                        <div class="font-medium text-gray-800">${sighting.road_name || '場所名なし'}</div>
                        <div class="text-gray-600 truncate mt-0.5">${sighting.comment || '詳細なし'}</div>
                    `;
                    itemDiv.addEventListener('click', () => {
                        map.setView([sighting.latitude, sighting.longitude], 14);
                        marker.openPopup();
                        if (window.innerWidth < 768) {
                            sidebar.classList.add('-translate-x-full');
                            setTimeout(() => { map.invalidateSize(); }, 200);
                        }
                    });
                    listItems.appendChild(itemDiv);
                });
            }

            // 管理者画面用データ一覧ロード
            async function loadAdminMarkers() {
                const adminListItems = document.getElementById('admin-list-items');
                adminListItems.innerHTML = '<p class="text-xs text-gray-400">読み込み中...</p>';

                const { data, error } = await db
                    .from('deer_spots')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    adminListItems.innerHTML = '<p class="text-xs text-red-500">データを取得できませんでした</p>';
                    return;
                }

                adminListItems.innerHTML = '';

                if (!data || data.length === 0) {
                    adminListItems.innerHTML = '<p class="text-xs text-gray-400">削除できるデータはありません</p>';
                    return;
                }

                data.forEach(sighting => {
                    const danger = sighting.danger_level || 'middle';
                    let badgeColor = 'bg-yellow-100 text-yellow-800';
                    if (danger === 'high') badgeColor = 'bg-orange-100 text-orange-800';
                    if (danger === 'danger') badgeColor = 'bg-red-100 text-red-800';

                    const adminDiv = document.createElement('div');
                    adminDiv.className = 'p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-xs space-y-1 flex items-center justify-between';
                    adminDiv.innerHTML = `
                        <div class="space-y-1 flex-1 pr-2">
                            <div class="flex items-center gap-2">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">【${danger}】</span>
                                <span class="font-medium text-gray-800">${sighting.road_name || '場所名なし'}</span>
                            </div>
                            <div class="text-gray-600 text-[11px] truncate">${sighting.comment || '詳細なし'} (${sighting.time_slot || ''})</div>
                        </div>
                        <button onclick="deleteSpot('${sighting.id}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-[11px] px-3 py-1.5 rounded transition shrink-0">削除</button>
                    `;
                    adminListItems.appendChild(adminDiv);
                });
            }

            window.deleteSpot = async function(id) {
                if (!confirm('本当にこの目撃情報を削除しますか？')) return;

                const { error } = await db
                    .from('deer_spots')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('削除に失敗しました: ' + error.message);
                } else {
                    alert('削除しました。');
                    loadMarkers();
                    loadAdminMarkers();
                }
            };

            // マップクリックで投稿
            map.on('click', async function(e) {
                submitSighting(e.latlng.lat, e.latlng.lng);
            });

            // 現在地（GPS）で投稿
            document.getElementById('add-current-loc-btn').addEventListener('click', () => {
                if (!navigator.geolocation) {
                    alert('お使いのブラウザは位置情報に対応していません。');
                    return;
                }

                alert('現在地を取得中...');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        map.setView([lat, lng], 15);
                        submitSighting(lat, lng);
                    },
                    (error) => {
                        alert('位置情報の取得に失敗しました。位置情報の利用許可を確認してください。(エラー: ' + error.message + ')');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });

            // データベース登録共通関数
            async function submitSighting(lat, lng) {
                const road = document.getElementById('input-road').value.trim();
                const timeSlot = document.getElementById('input-time').value.trim();
                const comment = document.getElementById('input-comment').value.trim();

                if (!road) {
                    alert('先にメニューから「場所・道路名」を入力してください！');
                    if (window.innerWidth < 768) {
                        sidebar.classList.remove('-translate-x-full');
                    }
                    return;
                }

                const { error } = await db
                    .from('deer_spots')
                    .insert([
                        { 
                            latitude: lat, 
                            longitude: lng, 
                            road_name: road,
                            danger_level: selectedDanger,
                            time_slot: timeSlot,
                            comment: comment,
                            is_approved: true
                        }
                    ]);

                if (error) {
                    alert('投稿に失敗しました: ' + error.message);
                } else {
                    alert('目撃情報を登録しました！');
                    document.getElementById('input-road').value = '';
                    document.getElementById('input-time').value = '';
                    document.getElementById('input-comment').value = '';
                    loadMarkers();
                    if (window.innerWidth < 768) {
                        sidebar.classList.add('-translate-x-full');
                        setTimeout(() => { map.invalidateSize(); }, 200);
                    }
                }
            }

            // 初期ロード
            loadMarkers();

        } catch (err) {
            console.error('スクリプト実行時エラー:', err);
            alert('アプリの初期化中にエラーが発生しました: ' + err.message);
        }
    </script>
</body>
</html>
